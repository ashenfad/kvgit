name: Build

# Every distributable built on every change, none published: a wheel per
# platform, the sdist, and the npm tarball. Publishing is the release
# workflow's job.

on:
  push:
    branches: [ main, core ]
  # Every pull request, whatever its base: a PR in a stack targets the
  # branch of the PR below it.
  pull_request:
  workflow_dispatch:

jobs:
  # abi3 wheels for CPython 3.10 and up, one per platform. Each wheel
  # built on a runner that can load it is installed and imported there.
  wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, smoke: false }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, smoke: true }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, smoke: false }
          - { runner: macos-15-intel, target: x86_64, smoke: true }
          - { runner: macos-latest, target: aarch64, smoke: true }
          - { runner: windows-latest, target: x64, smoke: true }

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build the wheel
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        args: --release --out dist

    - name: Install and import the wheel
      if: matrix.smoke
      shell: bash
      run: |
        python -m pip install dist/*.whl
        cd "$RUNNER_TEMP"
        python -c "import kvgit, kvgit._core as core; print(core.version())"

    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
        path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    # The sdist must build a working wheel on its own: everything the
    # Rust build needs has to be inside it.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build from the sdist and import
      run: |
        python -m pip install dist/*.tar.gz
        cd "$RUNNER_TEMP"
        python -c "import kvgit, kvgit._core as core; print(core.version())"

    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 11.0.4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # `pnpm pack` runs `prepare`, which builds dist/.
    - name: Pack the tarball
      run: pnpm pack --pack-destination "$RUNNER_TEMP/npm"

    - uses: actions/upload-artifact@v4
      with:
        name: npm
        path: ${{ runner.temp }}/npm/*.tgz
