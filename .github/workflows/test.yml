name: Tests

on:
  push:
    branches: [ main, core ]
  # Every pull request, whatever its base: a PR in a stack targets the
  # branch of the PR below it.
  pull_request:

jobs:
  # Lint runs once, in its own job. It used to be two trailing steps of
  # the matrix below, which meant a lint failure on the first Python to
  # finish cancelled the other four and left "CI red" saying nothing
  # about whether the suite passed.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run linter
      run: |
        ruff check python/

    - name: Check formatting
      run: |
        ruff format --check python/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest python/tests/ -v

  # The Postgres backend against a real server: its own tests and the
  # backend conformance suite, then the whole suite with every in-memory
  # store swapped for a Postgres table. Elsewhere psycopg is not
  # installed and those tests skip.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KVGIT_POSTGRES_DSN: host=localhost user=postgres password=postgres dbname=kvgit_test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,postgres]"

    - name: Create the test database
      run: |
        python -c "import psycopg; psycopg.connect('host=localhost user=postgres password=postgres dbname=postgres', autocommit=True).execute('CREATE DATABASE kvgit_test')"

    - name: Run backend tests
      run: |
        pytest python/tests/kv -v

    - name: Run the whole suite on Postgres
      run: |
        KVGIT_TEST_BACKEND=postgres pytest python/tests/ -q
