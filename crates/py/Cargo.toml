[package]
name = "kvgit-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
kvgit-core = { path = "../core" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[features]
# On for wheel builds only (maturin turns it on): it leaves libpython
# unlinked, which a `cargo test` binary needs linked.
extension-module = ["pyo3/extension-module"]
